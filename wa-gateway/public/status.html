<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Status KasRT WA Gateway</title>
    <link rel="icon" type="image/png" href="/kasrt-wa-gateway-icon-512.png" />
    <style>
      :root { color-scheme: light; --green: #008069; --bg: #e7f0ec; --text: #111b21; --muted: #667781; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: linear-gradient(180deg, var(--green) 0 150px, var(--bg) 150px); }
      main { width: min(760px, calc(100vw - 32px)); margin: 36px auto; padding: 24px; border-radius: 16px; background: #fff; box-shadow: 0 16px 40px rgba(17, 27, 33, .18); }
      header { display: flex; align-items: center; gap: 12px; }
      header img { width: 48px; height: 48px; border-radius: 14px; }
      h1 { margin: 0; font-size: 20px; } p { color: var(--muted); }
      #result { margin: 22px 0 0; padding: 16px; overflow: auto; border-radius: 10px; background: #f0f2f5; white-space: pre-wrap; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .error { color: #b42318; } a { color: var(--green); font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="/kasrt-wa-gateway-icon-512.png" alt="KasRT WA Gateway" />
        <div><h1>Status KasRT WA Gateway</h1><p id="hint">Memuat status dengan secret tersimpan…</p></div>
      </header>
      <pre id="result"></pre>
      <p><a href="/">← Kembali ke mini inbox</a></p>
    </main>
    <script>
      const result = document.querySelector('#result');
      const hint = document.querySelector('#hint');
      const secret = localStorage.getItem('kasrt_wa_lab_secret') || '';
      if (!secret) {
        hint.textContent = 'Secret belum tersimpan di browser ini.';
        result.className = 'error';
        result.textContent = 'Buka mini inbox, klik ⚙, lalu simpan WA Lab Secret.';
      } else {
        fetch('/status', { headers: { 'x-wa-lab-secret': secret } })
          .then(async (response) => ({ response, data: await response.json() }))
          .then(({ response, data }) => {
            if (!response.ok || !data.success) throw new Error(data.message || `HTTP ${response.status}`);
            hint.textContent = data.data.connected ? `Tertaut: ${data.data.linked_number || '-'}` : `Belum connected (${data.data.state})`;
            result.textContent = JSON.stringify(data, null, 2);
          })
          .catch((error) => {
            hint.textContent = 'Status tidak dapat dimuat.';
            result.className = 'error';
            result.textContent = error.message;
          });
      }
    </script>
  </body>
</html>
